[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bhoomi-verify"
version = "1.0.0"
description = "BhoomiVerify - Intelligent Land Record Digitization and Validation System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "shapely>=2.0.4",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "redis>=5.0.4",
    "reportlab>=4.2.0",
    "pillow>=10.3.0",
    "pypdf>=4.2.0",
    "networkx>=3.3"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
